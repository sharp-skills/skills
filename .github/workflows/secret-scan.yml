name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded credentials in URIs
        run: |
          FOUND=$(grep -rn "://[a-zA-Z0-9_-]\+:[a-zA-Z0-9_-]\+@" skills/ \
            | grep -v "localhost\|127\.0\.0\.1\|example\.com\|your-host\|<host>" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "❌ Hardcoded credentials found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No hardcoded credentials found"
